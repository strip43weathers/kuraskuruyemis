version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-kuruyemis_b2b}
      - POSTGRES_USER=${DB_USER:-b2b_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-b2b_pass}
    restart: always
    # YENİ: Veritabanının bağlantıya hazır olup olmadığını kontrol eder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-b2b_user} -d ${DB_NAME:-kuruyemis_b2b}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn kuraskuruyemis.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy # YENİ: Sadece db "sağlıklı" olduğunda web'i başlat
    restart: always

  nginx:
    image: nginx:1.25
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - media_data:/app/media
      - static_data:/app/staticfiles
      # YENİ: Certbot entegrasyonu için gerekli dizin eşlemeleri
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443" # YENİ: SSL konfigürasyonu için portu şimdiden dışarı açıyoruz
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  media_data:
  static_data:
