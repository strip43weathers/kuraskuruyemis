{% extends "public_base.html" %}
{% block content %}

<style>
    /* Premium Accordion Styling */
    .custom-accordion .accordion-item {
        border: none;
        background: transparent;
        margin-bottom: 1rem;
    }
    .custom-accordion .accordion-button {
        background-color: #fff;
        border-radius: 12px !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        font-weight: 600;
        color: var(--brand-primary);
        padding: 1.2rem 1.5rem;
    }
    .custom-accordion .accordion-button:not(.collapsed) {
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        color: var(--brand-accent);
    }
    .custom-accordion .accordion-button:focus {
        box-shadow: none;
    }
    .custom-accordion .accordion-body {
        background-color: transparent;
        padding: 1.2rem 1.5rem;
        line-height: 1.8;
    }
</style>

<div class="row justify-content-center mt-5 mb-5">
    <div class="col-lg-9">
        <div class="text-center mb-5">
            <h2 class="brand-font fw-bold mb-3">Sıkça Sorulan Sorular</h2>
            <p class="text-muted">Aklınıza takılan soruların cevaplarını burada bulabilirsiniz.</p>
        </div>

        <div class="accordion custom-accordion" id="faqAccordion">
            
            {% for item in faqs %}
            <div class="accordion-item">
                <h2 class="accordion-header" id="heading{{ item.id }}">
                    <!-- İlk soru haricindekilerin kapalı gelmesi için collapsed class'ını dinamik ekliyoruz -->
                    <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" 
                            type="button" 
                            data-bs-toggle="collapse" 
                            data-bs-target="#faq{{ item.id }}" 
                            aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" 
                            aria-controls="faq{{ item.id }}">
                        {{ item.question }}
                    </button>
                </h2>
                <!-- Aynı şekilde sadece ilk sorunun show (açık) class'ı almasını sağlıyoruz -->
                <div id="faq{{ item.id }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" aria-labelledby="heading{{ item.id }}" data-bs-parent="#faqAccordion">
                    <div class="accordion-body text-muted">
                        {{ item.answer|linebreaksbr }}
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="text-center py-5">
                <h5 class="text-muted brand-font">Henüz soru eklenmedi.</h5>
            </div>
            {% endfor %}

        </div>
    </div>
</div>
{% endblock %}
