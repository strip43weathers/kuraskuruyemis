{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kuraş Kuruyemiş | Taptaze Lezzetler</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        .top-bar { font-size: 0.85rem; border-bottom: 1px solid #f0f0f0; background: #fff;}
        .top-bar a { color: #6c757d; text-decoration: none; margin-left: 15px; }
        .category-nav a { color: #000; font-weight: bold; text-decoration: none; padding: 10px 15px; font-size: 0.95rem; }
        .search-box { border-radius: 50px; background-color: #f8f9fa; border: 1px solid #e9ecef; }
        .search-box input { background: transparent; border: none; box-shadow: none; }
        .search-box input:focus { outline: none; box-shadow: none; }
        
        body { 
            background-color: #ffffff; 
            /* Arka plan görseli ayarları buradan silindi, görseli sol sütuna taşıdık */
        }
    </style>
</head>
<body>
    <div class="top-bar py-2 text-muted d-none d-md-block">
        <div class="container d-flex justify-content-between">
            <div><i class="bi bi-telephone-fill me-1"></i> MÜŞTERİ DESTEK HATTI: <strong class="text-dark">0850 XXX XX XX</strong></div>
            <div>
                <a href="#">İLETİŞİM</a>
                <a href="{% url 'login' %}">BAYİ GİRİŞİ</a> 
            </div>
        </div>
    </div>

    <div class="container py-4">
        <div class="row align-items-center">
            <div class="col-md-3 text-center text-md-start mb-3 mb-md-0">
                <a href="{% url 'home' %}" class="text-decoration-none text-dark">
                    <h2 class="fw-bold mb-0" style="color: #6a1b9a; font-style: italic;">Kuraş</h2>
                </a>
            </div>
            <div class="col-md-6">
                <form action="{% url 'home' %}" method="GET" class="search-box d-flex px-3 py-2">
                    <input type="text" name="q" class="form-control" placeholder="Ürün ara..." value="{{ current_query }}">
                    <button type="submit" class="btn btn-link text-dark p-0"><i class="bi bi-search"></i></button>
                </form>
            </div>
            <div class="col-md-3"></div> 
        </div>
    </div>

    <div class="border-top border-bottom py-2 mb-4 d-none d-md-block">
        <div class="container">
            <div class="category-nav d-flex justify-content-center flex-wrap">
                <a href="{% url 'home' %}">Tüm Ürünler</a>
                {% for cat in categories %}
                    <a href="{% url 'home' %}?category={{ cat.id }}">{{ cat.name }}</a>
                {% endfor %}
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row"> 
            
            <div class="col-lg-2 d-none d-lg-block">
                <div style="position: sticky; top: 40px; z-index: 0;">
                    <img src="{% static 'img/bg-nuts.png' %}" alt="Kuruyemiş" class="img-fluid" style="opacity: 0.95;">
                </div>
            </div>

            <div class="col-lg-10" style="z-index: 1;"> 
                {% block content %}{% endblock %}
            </div>
            
        </div>
    </div>
</body>
</html>
