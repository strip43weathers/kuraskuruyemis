{% extends 'public_base.html' %} <!-- Mevcut base şablonunuzu kullanın -->

{% block content %}
  <h1>Şubelerimiz</h1>
  <div class="branch-list">
    {% for branch in branches %}
      <div class="branch-card">
        {% if branch.image %}
          <img src="{{ branch.image.url }}" alt="{{ branch.name }}">
        {% endif %}
        <h2><a href="{% url 'branches:detail' branch.pk %}">{{ branch.name }}</a></h2>
        <p>{{ branch.phone }}</p>
      </div>
    {% endfor %}
  </div>
{% endblock %}
