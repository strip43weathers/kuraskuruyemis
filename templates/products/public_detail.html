{% extends "public_base.html" %}

{% block content %}
<div class="premium-card p-4 p-md-5 mt-4">
    <div class="row align-items-center">
        <div class="col-md-6 mb-4 mb-md-0">
            <div class="rounded-4 overflow-hidden shadow-sm" style="background: #f8f9fa;">
                {% if product.image %}
                    <img src="{{ product.image.url }}" class="img-fluid w-100" alt="{{ product.name }}" style="object-fit: cover; max-height: 500px;">
                {% else %}
                    <div class="d-flex align-items-center justify-content-center" style="height: 400px;">
                        <i class="bi bi-camera fs-1 text-muted opacity-25"></i>
                    </div>
                {% endif %}
            </div>
        </div>

        <div class="col-md-6 ps-md-5">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="{% url 'home' %}" class="text-decoration-none text-muted">Katalog</a></li>
                    <li class="breadcrumb-item active text-dark fw-medium">{{ product.category.name }}</li>
                </ol>
            </nav>

            <h1 class="brand-font fw-bold mb-2">{{ product.name }}</h1>
            
            <div class="d-flex align-items-center gap-3 mb-4 pb-4 border-bottom">
                <span class="badge bg-light text-dark border px-3 py-2 rounded-pill"><i class="bi bi-upc-scan me-2"></i>SKU: {{ product.sku }}</span>
            </div>

            <div class="product-description text-secondary mb-5" style="line-height: 1.9; font-size: 1.05rem;">
                <h5 class="brand-font text-dark mb-3">Ürün Hakkında</h5>
                {{ product.description|linebreaks }}
            </div>

            <div class="bg-light p-4 rounded-4">
                <div class="d-flex align-items-center">
                    <div class="me-3">
                        <i class="bi bi-info-circle fs-3" style="color: var(--brand-accent);"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
