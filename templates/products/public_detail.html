{% extends "public_base.html" %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-6 mb-4">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
            {% else %}
                <div class="bg-light d-flex align-items-center justify-content-center" style="height: 450px;">
                    <i class="bi bi-image fs-1 text-muted"></i>
                </div>
            {% endif %}
        </div>
    </div>

    <div class="col-md-6 ps-md-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'home' %}" class="text-decoration-none">Anasayfa</a></li>
                <li class="breadcrumb-item active">{{ product.category.name }}</li>
            </ol>
        </nav>

        <h1 class="fw-bold mb-3">{{ product.name }}</h1>
        <div class="badge bg-secondary mb-4">{{ product.sku }}</div>

        <div class="product-description text-secondary" style="line-height: 1.8;">
            <h5 class="text-dark fw-bold border-bottom pb-2 mb-3">Ürün Açıklaması</h5>
            {{ product.description|linebreaks }}
        </div>
    </div>
</div>
{% endblock %}
