version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-kuruyemis_b2b}
      - POSTGRES_USER=${DB_USER:-b2b_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-b2b_pass}
    ports:
      - "5432:5432"
    # YENİ: Veritabanının bağlantıya hazır olup olmadığını kontrol eder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-b2b_user} -d ${DB_NAME:-kuruyemis_b2b}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_data_dev:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # YENİ: Sadece db "sağlıklı" olduğunda web'i başlat

volumes:
  postgres_data_dev:
  media_data_dev:
